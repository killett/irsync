[workspace]
name = "irsync"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]
exclude-newer = "7d"

# To urgently bypass the cooldown for a CVE fix, add:
# [exclude-newer]
# affected-package = "0d"

# drivecfg is a first-party package: we publish its releases ourselves, so
# the supply-chain cooldown that guards against a compromised upstream
# doesn't apply to it. Scoped to drivecfg only — the global 7d cooldown
# above still governs every other dependency. (Note: the manifest key is
# `pypi-exclude-newer`, not `[exclude-newer]` with a package sub-key —
# verified against pixi 0.69.0's schema.)
[pypi-exclude-newer]
drivecfg = "0d"

[dependencies]
python = ">=3.12,<3.14"
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"
pre-commit = "*"
rsync = ">=3.4.1,<4"

[tasks]
# On macOS, pixi-installed tools (pytest, ruff, mypy) can fail due to shebang path resolution issues. Using python -m <tool> bypasses this reliably.
test = "python -m pytest"
test-cov = "python -m pytest --cov"  # Later on, consider adding --cov-fail-under=80
lint = "python -m ruff check ."
format = "python -m ruff format ."
typecheck = "python -m mypy ."

[pypi-dependencies]
drivecfg = ">=0.1.0, <0.2"
