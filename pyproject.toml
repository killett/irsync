[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irsync"
dynamic = ["version"]
description = "Rename-aware rsync wrapper that uses inode snapshots to skip retransfer of moved files."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Emmy Killett", email = "57272627+killett@users.noreply.github.com" }]
keywords = ["rsync", "backup", "inode", "rename", "snapshot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
    "Typing :: Typed",
]
dependencies = ["drivecfg>=0.1,<1"]

[project.scripts]
irsync = "irsync.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/killett/irsync"
Repository = "https://github.com/killett/irsync"
Issues = "https://github.com/killett/irsync/issues"

[tool.hatch.version]
path = "src/irsync/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/irsync"]

[tool.ruff]
# Narrative documents, not source. Newer ruff formats Python code blocks
# inside markdown, and the design docs and implementation plans under docs/
# deliberately contain illustrative fragments that are not standalone-valid
# Python (indented dict entries shown for insertion into an existing helper,
# for example). Formatting those is wrong, and it made CI disagree with the
# local gate purely because the two run different ruff versions.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — unused imports, undefined names, etc.
    "E",      # pycodestyle errors (subset — see ignores below)
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "B9",     # bugbear opinionated rules
    "UP",     # pyupgrade — modernize syntax to latest Python
    "I",      # isort — import ordering
    "ANN",    # flake8-annotations — enforce type hints
    "D",      # enable the pydocstyle rules
    "S",      # bandit — security linter (subset — see ignores below)
]
ignore = [
    "E501",   # line too long (handled by ruff format)
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package (__init__.py)
    "ANN204", # missing return type annotation for __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S"]  # Otherwise Claude would either over-annotate every test or fight ruff constantly.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]  # Tests often have untyped functions and use dynamic features, so relax mypy rules for them.
module = ["tests.*"]
strict = false
warn_return_any = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_untyped_decorators = false
check_untyped_defs = false

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
